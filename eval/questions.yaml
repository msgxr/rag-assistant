# Test soru seti.
# type: answerable | unanswerable | edge
# expect_contains: cevapta geçmesi beklenen anahtar kelime (küçük harf, dil bağımsız)
# edge: sistemin çökmeden, hatasız ve anlamlı bir cevap/fallback vermesi beklenir

# ── Foundry Local ──────────────────────────────────────────────────────────────
- question: "Foundry Local Intel Mac'lerde çalışır mı?"
  type: answerable
  expect_contains: "intel"

- question: "Foundry Local hangi donanım hızlandırma yöntemlerini kullanır?"
  type: answerable
  expect_contains: "gpu"

# Not: dökümanlar İngilizce, cevap Türkçe gelebilir; anahtar kelime olarak
# dil bağımsız terimler (özel ad, sayı, komut adı) tercih edildi.
- question: "Foundry Local'de model nasıl indirilir?"
  type: answerable

- question: "qwen2.5-0.5b modeli ne zaman tercih edilmeli?"
  type: answerable
  expect_contains: "qwen"

# ── RAG ───────────────────────────────────────────────────────────────────────
- question: "RAG'in üç adımı nedir?"
  type: answerable
  expect_contains: "getirme"

- question: "Halüsinasyon nedir?"
  type: answerable
  expect_contains: "halüsinasyon"

- question: "RAG ne zaman kullanılır?"
  type: answerable
  expect_contains: "rag"

# ── Embeddings ────────────────────────────────────────────────────────────────
- question: "Cosine similarity nedir?"
  type: answerable
  expect_contains: "cosine"

- question: "Top-K retrieval'da K değeri bu projede kaçtır?"
  type: answerable
  expect_contains: "3"

- question: "Embedding modeli ile chat modeli arasındaki fark nedir?"
  type: answerable
  expect_contains: "embedding"

# ── SQLite ────────────────────────────────────────────────────────────────────
- question: "SQLite veriyi nerede saklar?"
  type: answerable

- question: "documents tablosundaki dört sütunun adları nelerdir?"
  type: answerable

- question: "rag.db nasıl yeniden oluşturulur?"
  type: answerable
  expect_contains: "ingest"

# ── Prompt Engineering ────────────────────────────────────────────────────────
- question: "RAG promptlarında system prompt ne işe yarar?"
  type: answerable
  expect_contains: "prompt"

- question: "Neden cevaplarda kaynak dosya adı gösterilir?"
  type: answerable
  expect_contains: "kaynak"

# ── Pipeline ──────────────────────────────────────────────────────────────────
- question: "ingest.py ne yapar?"
  type: answerable

- question: "Varsayılan chunk boyutu kaç karakterdir?"
  type: answerable
  expect_contains: "800"

- question: "Minimum benzerlik skoru nedir?"
  type: answerable
  expect_contains: "0.45"

# ── Cevapsız sorular ──────────────────────────────────────────────────────────
- question: "Bu projenin bütçesi ne kadar?"
  type: unanswerable

- question: "İstanbul'da bugün hava nasıl?"
  type: unanswerable

- question: "2026 dünya kupasını kim kazandı?"
  type: unanswerable

- question: "Foundry Local'in hisse fiyatı nedir?"
  type: unanswerable

# ── Edge case'ler (boş, tek kelime, çok genel, çok uzun) ──────────────────────
- question: ""
  type: edge
  expect_contains: "soru"

- question: "RAG"
  type: edge

- question: "Bana her şeyi anlat"
  type: edge

- question: "Merhaba, ben bu projeyi yeni kurdum ve dökümanları okumaya vaktim olmadı, bana lütfen bu sistemin ne işe yaradığını, hangi teknolojileri kullandığını, verilerin nerede saklandığını, embedding denen şeyin ne olduğunu ve bir sorunun cevabının adım adım nasıl üretildiğini tek seferde, olabildiğince ayrıntılı şekilde anlatır mısın?"
  type: edge
